name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Python and JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:${{ matrix.language }}
      - name: Block unresolved high and critical code findings
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ANALYZED_REF: ${{ github.ref }}
          ANALYZED_CATEGORY: /language:${{ matrix.language }}
        run: |
          gh api --method GET --paginate --slurp "repos/$GH_REPO/code-scanning/alerts" -f state=open -f ref="$ANALYZED_REF" > "$RUNNER_TEMP/code-alerts.json"
          python scripts/check_code_scanning.py "$RUNNER_TEMP/code-alerts.json" "$ANALYZED_CATEGORY"
