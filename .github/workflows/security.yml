name: Security and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_runtime:
        description: Publish the exact validated image to GHCR for staging and later digest promotion
        type: boolean
        default: false
  schedule:
    - cron: "41 8 * * 1"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: glycofy
          POSTGRES_PASSWORD: glycofy_test
          POSTGRES_DB: glycofy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U glycofy -d glycofy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app tests
      - run: mypy app
      - run: pytest -q
      - name: Test complete PostgreSQL migration chain
        env:
          DATABASE_URL: postgresql+psycopg://glycofy:glycofy_test@127.0.0.1:5432/glycofy_test
        run: |
          alembic upgrade head
          test "$(alembic current 2>/dev/null | awk '{print $1}')" = "$(alembic heads 2>/dev/null | awk '{print $1}')"
      - run: pip-audit -r requirements.txt
      - run: bandit -q -ll -r app -x tests

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm install --global npm@11
      - run: npm ci --ignore-scripts
      - run: node --test tests/*_ui.test.cjs
      - run: npm audit --audit-level=moderate

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: glycofy
          POSTGRES_PASSWORD: glycofy_test
          POSTGRES_DB: glycofy_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U glycofy -d glycofy_runtime"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the production image
        id: image_build
        run: docker build --label org.opencontainers.image.source=https://github.com/${{ github.repository }} --label org.opencontainers.image.revision=${{ github.sha }} --tag glycofy:${{ github.sha }} .
      - name: Verify the image runs as the unprivileged app user
        run: test "$(docker image inspect glycofy:${{ github.sha }} --format '{{.Config.User}}')" = "65532:65532"
      - name: Verify private build inputs are absent from the runtime image
        run: docker run --rm --entrypoint python glycofy:${{ github.sha }} -c "from pathlib import Path; assert not any(Path(p).exists() for p in ['/app/.git', '/app/.env', '/app/node_modules', '/app/glycofy.db', '/app/app.db'])"
      - name: Smoke-test native libraries in the production image
        env:
          DATABASE_URL: postgresql+psycopg://unused:unused@127.0.0.1/unused
        run: |
          docker run --rm -i -e DATABASE_URL --entrypoint python glycofy:${{ github.sha }} - <<'PYTHON'
          import ssl
          import uuid
          assert uuid.uuid4().version == 4
          import bcrypt
          import psycopg
          from cryptography.fernet import Fernet
          from zoneinfo import ZoneInfo
          assert ZoneInfo("America/Los_Angeles") is not None
          import importlib.util
          assert importlib.util.find_spec("_sqlite3") is None
          from app.main import app
          assert app is not None
          assert ssl.create_default_context().get_ca_certs()
          assert psycopg.pq.version() > 0
          key = Fernet.generate_key()
          cipher = Fernet(key)
          assert cipher.decrypt(cipher.encrypt(b"synthetic-smoke-test")) == b"synthetic-smoke-test"
          password = b"synthetic-smoke-test"
          assert bcrypt.checkpw(password, bcrypt.hashpw(password, bcrypt.gensalt()))
          print("Native library and application import smoke checks passed")
          PYTHON
      - name: Verify patched zlib and repeated failed writes
        run: docker run --rm --entrypoint python glycofy:${{ github.sha }} scripts/container/check_zlib.py --vex > zlib-fixed.openvex.json
      - name: Verify migrations and readiness against PostgreSQL in the runtime image
        env:
          DATABASE_URL: postgresql+psycopg://glycofy:glycofy_test@127.0.0.1:5432/glycofy_runtime
        run: |
          docker run --rm --network host -e DATABASE_URL --entrypoint /bin/sh glycofy:${{ github.sha }} -c 'alembic upgrade head'
          docker run --detach --name runtime-smoke --network host -e DATABASE_URL -e PORT=10000 glycofy:${{ github.sha }}
          trap 'docker logs runtime-smoke; docker rm -f runtime-smoke' EXIT
          python - <<'PYTHON'
          import time
          import urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:10000/ready", timeout=2) as response:
                      assert response.status == 200
                  break
              except (OSError, AssertionError):
                  time.sleep(1)
          else:
              raise RuntimeError("Runtime PostgreSQL readiness did not pass")
          import http.cookiejar
          import json
          from urllib.error import HTTPError
          def browser():
              return urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          def request(client, path, payload=None, method=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request("http://127.0.0.1:10000" + path, data=data, method=method,
                                           headers={"Content-Type": "application/json"})
              with client.open(req, timeout=10) as response:
                  assert response.status == 200
                  return json.load(response)
          first, second = browser(), browser()
          account = {"email": "runtime-smoke@example.com", "password": "runtime-only-session-passphrase-2026"}
          assert request(first, "/auth/signup", account)["ok"]
          assert request(second, "/auth/login", account)["ok"]
          sessions = request(first, "/auth/sessions")["sessions"]
          assert len(sessions) == 2
          other = next(row for row in sessions if not row["current"])
          request(first, f"/auth/sessions/{other['id']}", method="DELETE")
          try:
              request(second, "/users/me")
          except HTTPError as exc:
              assert exc.code == 401
          else:
              raise AssertionError("Revoked PostgreSQL session was accepted")
          request(first, "/users/me")
          print("Runtime signup, login, PostgreSQL sessions and revocation passed")
          PYTHON
          docker run --rm -i --network host -e DATABASE_URL --entrypoint python glycofy:${{ github.sha }} - <<'PYTHON'
          from datetime import date
          from app.db import SessionLocal
          from app.models import EnergyTarget, User, UserPreference
          from app.routers.llm_recommend import _get_or_create_plan
          with SessionLocal() as db:
              user = User(email="planning-runtime@example.invalid", password_hash="!disabled-smoke-test")
              db.add(user)
              db.flush()
              preference = UserPreference(user_id=user.id, daily_snack_count=2)
              energy = EnergyTarget(user_id=user.id, date=date(2026, 11, 9), target_kcal=2000)
              db.add_all([preference, energy])
              db.flush()
              plan = _get_or_create_plan(db, user.id, date(2026, 11, 9))
              for row in (preference, energy, plan):
                  db.refresh(row)
                  assert row.created_at is not None and row.updated_at is not None
              assert _get_or_create_plan(db, user.id, plan.date).id == plan.id
              db.rollback()
          print("Migrated PostgreSQL planning, preference and energy-target inserts passed")
          from app.models import Activity, OAuthAccount
          from app.services import auto_sync, imports_strava
          with SessionLocal() as db:
              athlete = User(email="strava-runtime@example.invalid", password_hash="!disabled-smoke-test")
              db.add(athlete)
              db.flush()
              athlete_id = athlete.id
              db.add(OAuthAccount(user_id=athlete_id, provider="strava", access_token="synthetic-token", expires_at=2147483647))
              db.commit()
          imports_strava._pull_page = lambda *args, **kwargs: [
              {"id": 123, "type": "Ride", "start_date": "2026-11-01T12:00:00Z", "elapsed_time": 600}
          ]
          try:
              auto_sync._sync_accounts()
              auto_sync._sync_accounts()
              with SessionLocal() as db:
                  activity = db.query(Activity).filter(Activity.user_id == athlete_id).one()
                  assert activity.provider == "strava" and activity.source_id == "123"
                  assert activity.created_at is not None and activity.duration_s == 600
          finally:
              with SessionLocal() as db:
                  db.query(Activity).filter(Activity.user_id == athlete_id).delete(synchronize_session=False)
                  db.query(OAuthAccount).filter(OAuthAccount.user_id == athlete_id).delete(synchronize_session=False)
                  db.delete(db.get(User, athlete_id))
                  db.commit()
          print("Migrated PostgreSQL scheduled Strava import and idempotence passed")
          PYTHON
      - name: Generate the production image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: glycofy:${{ github.sha }}
          format: spdx-json
          output-file: glycofy-${{ github.sha }}.spdx.json
          artifact-name: glycofy-${{ github.sha }}-sbom.spdx.json
          upload-artifact: true
          upload-artifact-retention: 30
      - name: Block all high or critical vulnerabilities, including unfixed findings
        env:
          TRIVY_VEX: zlib-fixed.openvex.json
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: glycofy:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table

      - name: Inventory all container vulnerabilities, including unfixed findings
        id: vulnerability_inventory
        if: ${{ !cancelled() && steps.image_build.outcome == 'success' }}
        run: >-
          trivy image --scanners vuln
          --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          --ignore-unfixed=false --exit-code 0 --format json
          --output container-vulnerabilities.json
          glycofy:${{ github.sha }}
      - name: Summarize every image vulnerability
        if: ${{ !cancelled() && steps.vulnerability_inventory.outcome == 'success' }}
        run: |
          python - <<'PYTHON'
          import collections
          import json
          import os
          from pathlib import Path
          report = json.loads(Path("container-vulnerabilities.json").read_text())
          findings = [item for result in report.get("Results", []) for item in result.get("Vulnerabilities", [])]
          counts = collections.Counter(item["Severity"] for item in findings)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Complete runtime vulnerability inventory\n\n")
              summary.write("Includes unfixed findings; counts are package/CVE pairs.\n\n")
              for severity in ("CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"):
                  summary.write(f"- {severity}: {counts[severity]}\n")
              summary.write(f"\nDistinct CVEs: {len({item['VulnerabilityID'] for item in findings})}\n")
          PYTHON
      - name: Retain the complete container vulnerability inventory
        if: ${{ !cancelled() && steps.vulnerability_inventory.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-vulnerabilities-${{ github.sha }}
          path: |
            container-vulnerabilities.json
            zlib-fixed.openvex.json
          retention-days: 30
          if-no-files-found: error

      - name: Retain the exact tested runtime image
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_runtime }}
        run: |
          docker save glycofy:${{ github.sha }} --output runtime-image.tar
          sha256sum runtime-image.tar > runtime-image.tar.sha256
          docker image inspect glycofy:${{ github.sha }} --format '{{.Id}}' > runtime-image-id.txt
      - name: Upload the tested image for publication without rebuilding
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_runtime }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-runtime-${{ github.sha }}
          path: |
            runtime-image.tar
            runtime-image.tar.sha256
            runtime-image-id.txt
          retention-days: 7
          if-no-files-found: error

  publish_runtime:
    # No package-write credential is available to the build/test jobs or PR events.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_runtime }}
    needs: [python, javascript, secrets, container]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Download this run's exact tested image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-runtime-${{ github.sha }}
      - name: Verify, load and publish without a rebuild
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          sha256sum --check runtime-image.tar.sha256
          docker load --input runtime-image.tar
          test "$(docker image inspect "glycofy:$SOURCE_SHA" --format '{{.Id}}')" = "$(cat runtime-image-id.txt)"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker tag "glycofy:$SOURCE_SHA" "$IMAGE_REPOSITORY:$SOURCE_SHA"
          docker push "$IMAGE_REPOSITORY:$SOURCE_SHA"
          docker image inspect "$IMAGE_REPOSITORY:$SOURCE_SHA" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | grep -F "$IMAGE_REPOSITORY@sha256:" > runtime-image-reference.txt
          grep -Eq '^ghcr.io/[^[:space:]]+@sha256:[0-9a-f]{64}$' runtime-image-reference.txt
          test "$(wc -l < runtime-image-reference.txt)" -eq 1
          docker pull "$(cat runtime-image-reference.txt)"
          test "$(docker image inspect "$(cat runtime-image-reference.txt)" --format '{{.Id}}')" = "$(cat runtime-image-id.txt)"
          printf '## Tested runtime image\n\nSource commit: `%s`\n\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat runtime-image-reference.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Retain promotion evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-image-release-${{ github.sha }}
          path: |
            runtime-image-reference.txt
            runtime-image-id.txt
            runtime-image.tar.sha256
          retention-days: 30
          if-no-files-found: error
