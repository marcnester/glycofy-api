version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    labels: [dependencies, security]
    ignore:
      # Passlib 1.7.4 depends on bcrypt's pre-4.1 backend behavior.
      # Remove this guard when password hashing is migrated off Passlib.
      - dependency-name: bcrypt
        versions: [">=4.1.0"]
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    labels: [dependencies, security]
    groups:
      javascript-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    labels: [dependencies, security]
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 3
    labels: [dependencies, security]
