<!DOCTYPE html>
<html lang="en" class="ui-root">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile • Glycofy</title>
  <link rel="icon" href="/ui/assets/glycofy-mark.png" type="image/png" />
  <link rel="stylesheet" href="/ui/styles.css?v=2025-11-04" />
  <link rel="stylesheet" href="/ui/styles.activities.css?v=2025-11-04" />

  <style>
    html.ui-root, body.ui-root {
      background:#0f1318;
      color:#e7ecf3;
      font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif
    }
    .container{max-width:1200px;margin:0 auto;padding:0 24px}
    .topbar{
      position:sticky;top:0;z-index:100;
      background:rgba(16,20,28,.85);
      border-bottom:1px solid rgba(80,200,138,.10);
      backdrop-filter:saturate(140%) blur(8px)
    }
    .nav{display:flex;gap:10px;align-items:center}
    .nav a{
      display:inline-flex;align-items:center;height:36px;padding:0 14px;
      border-radius:999px;color:#e7ecf3;text-decoration:none;border:1px solid transparent
    }
    .nav a.active{background:#101826;border-color:rgba(80,200,138,.24)}
    .btn.btn--pill{
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
      color:#e5ecff;padding:10px 16px;border-radius:14px;font-weight:600
    }
    .page{padding:40px 0 80px}
    .card{
      border:1px solid rgba(255,255,255,.08);
      border-radius:16px;
      background:rgba(255,255,255,.02)
    }
    .card--glass{
      background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0)),rgba(16,20,28,.6)
    }
    .muted{color:#9fb0c9}
    .flash{margin:12px 0;padding:10px 12px;border-radius:12px;display:none}
    .flash--ok{
      display:block;
      background:rgba(46,204,113,.12);
      border:1px solid rgba(46,204,113,.25)
    }
    .flash--error{
      display:block;
      background:rgba(231,76,60,.12);
      border:1px solid rgba(231,76,60,.25)
    }
    .flash--warn{
      display:block;
      background:rgba(245,158,11,.10);
      border:1px solid rgba(245,158,11,.25)
    }
    .pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:6px 10px;border-radius:999px;
      border:1px solid rgba(255,255,255,.12)
    }
    .pill--ok{
      background:rgba(46,204,113,.12);
      border-color:rgba(46,204,113,.35)
    }
    .pill--warn{
      background:rgba(245,158,11,.10);
      border-color:rgba(245,158,11,.35)
    }
    .strava-icon{
      width:28px;height:28px;
      display:inline-flex;align-items:center;justify-content:center;
      border-radius:999px;border:1px solid rgba(255,255,255,.12)
    }
    .strava-icon.ok{
      background:rgba(248,131,37,.18);
      border-color:rgba(248,131,37,.35)
    }
    .strava-icon svg{width:16px;height:16px;display:block}
    .strava-connect{
      display:inline-flex;border:0;background:transparent;padding:0;cursor:pointer;border-radius:6px
    }
    .strava-connect:focus-visible{outline:3px solid #78dba7;outline-offset:3px}
    .strava-connect img{display:block;width:237px;height:48px}

    /* Meal Preferences */
    .section-title{margin:0 0 8px 0;font-size:clamp(22px,3vw,28px)}
    .field label{
      display:block;font-size:.9rem;color:#9fb0c9;margin-bottom:6px
    }
    .input{
      height:38px;border-radius:10px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);
      color:#e7ecf3;padding:0 10px
    }
    .input--wide{width:100%}
    .radio-set{display:flex;gap:10px;flex-wrap:wrap}
    .radio-chip{
      display:inline-flex;gap:8px;align-items:center;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);
      padding:8px 12px;border-radius:999px;
      cursor:pointer;user-select:none
    }
    .radio-chip input{
      appearance:none;width:14px;height:14px;
      border-radius:999px;border:1px solid rgba(255,255,255,.35);display:inline-block
    }
    .radio-chip input:checked{
      background:#50c88a;
      border-color:#50c88a;
      color:#071b14
    }
    .save-hint{font-size:.85rem}

    /* Inline editable profile name */
    .editable-field{
      cursor:text;
      min-height:24px;
      padding:4px 6px;
      border-radius:8px;
      border:1px solid transparent;
      transition:border-color .15s ease,background-color .15s ease;
    }
    .editable-field:focus{
      outline:none;
      border-color:rgba(80,200,138,.6);
      background:rgba(255,255,255,.04);
    }
  </style>
</head>
<body class="ui-root">
  <header class="topbar">
    <div class="container topbar__inner" style="display:flex;align-items:center;justify-content:space-between;height:64px;">
      <a class="brand" href="/ui/index.html" aria-label="Glycofy home"><img src="/ui/assets/glycofy-logo-lockup.png" alt="Glycofy"/></a>
      <nav class="nav" aria-label="Primary">
        <a href="/ui/index.html">Home</a>
        <a href="/ui/plan.html">Plan</a>
        <a href="/ui/profile.html" class="active">Profile</a>
        <a href="/ui/activities.html">Activities</a>
      </nav>
      <div class="nav">
        <button id="logout_btn" class="btn btn--pill">Logout</button>
      </div>
    </div>
  </header>

  <main class="page container">
    <div id="flash" class="flash"></div>

    <section class="card card--glass" style="padding:28px;display:grid;gap:18px;">
      <h1 style="margin:0 0 6px 0;font-size:clamp(28px,4vw,42px);line-height:1.05">Profile</h1>
      <div class="grid grid--cols-3" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px">
        <div class="field">
          <label>Name</label>
          <div
            id="user_name"
            class="editable-field"
            aria-label="Display name"
            role="textbox"
            contenteditable="true"
          >—</div>
        </div>
        <div class="field"><label>Email</label><div id="user_email">—</div></div>
        <div class="field"><label>Units</label><div id="user_units">—</div></div>
      </div>
    </section>

    <!-- Meal Preferences -->
    <section class="card" style="margin-top:18px;padding:22px;">
      <h2 class="section-title">Meal Preferences</h2>
      <p class="muted" style="margin-top:-2px">Used by AI to recommend recipes that fit your diet.</p>

      <div class="field" style="margin-top:10px">
        <label>Diet</label>
        <div class="radio-set" id="diet_group" role="radiogroup" aria-label="Diet preference">
          <label class="radio-chip"><input type="radio" name="diet" value="omnivore"> Omnivore</label>
          <label class="radio-chip"><input type="radio" name="diet" value="pescatarian"> Pescatarian</label>
          <label class="radio-chip"><input type="radio" name="diet" value="vegetarian"> Vegetarian</label>
          <label class="radio-chip"><input type="radio" name="diet" value="vegan"> Vegan</label>
        </div>
      </div>

      <div class="field" style="margin-top:14px">
        <label>Food allergies (strictly excluded)</label>
        <div class="radio-set" id="allergen_group" aria-label="Food allergies">
          <label class="radio-chip"><input type="checkbox" name="allergen" value="milk"> Milk</label>
          <label class="radio-chip"><input type="checkbox" name="allergen" value="egg"> Egg</label>
          <label class="radio-chip"><input type="checkbox" name="allergen" value="fish"> Fish</label>
          <label class="radio-chip"><input type="checkbox" name="allergen" value="shellfish"> Shellfish</label>
          <label class="radio-chip"><input type="checkbox" name="allergen" value="tree_nuts"> Tree nuts</label>
          <label class="radio-chip"><input type="checkbox" name="allergen" value="peanut"> Peanuts</label>
          <label class="radio-chip"><input type="checkbox" name="allergen" value="wheat"> Wheat</label>
          <label class="radio-chip"><input type="checkbox" name="allergen" value="soy"> Soy</label>
          <label class="radio-chip"><input type="checkbox" name="allergen" value="sesame"> Sesame</label>
        </div>
        <p class="muted" style="margin:8px 0 0">Meal suggestions exclude these ingredients. Always verify product labels and cross-contact risk.</p>
      </div>

      <div class="field" style="margin-top:14px">
        <label>Other intolerances, dislikes, or ingredients to avoid (comma-separated)</label>
        <input id="exclusions_input" class="input input--wide" placeholder="e.g., lactose intolerant, mushrooms, cilantro" />
        <div id="pref_status" class="muted save-hint" style="margin-top:6px">Auto-saves</div>
      </div>
    </section>

    <section class="card" style="margin-top:18px;padding:22px;">
      <h2 style="margin:0 0 12px 0;">Strava</h2>
      <div class="row row--gap" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <span id="strava_icon" class="strava-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="#f88125" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3l4.5 8h-3L12 6l-1.5 5h-3L12 3zM16.5 13l2.5 4h-2l-.5-1-1 2h-2l2.5-5z"/>
          </svg>
        </span>
        <span id="strava_status" class="pill pill--warn">Checking…</span>

        <button id="strava_manage" class="btn btn--pill" style="display:none">Manage in Strava</button>
        <button id="strava_reconnect" class="strava-connect" aria-label="Connect with Strava">
          <img src="/ui/assets/connect-with-strava.png" alt="Connect with Strava" width="237" height="48">
        </button>
        <button id="strava_disconnect" class="btn btn--pill" style="display:none">Disconnect</button>
      </div>
    </section>
  </main>

  <script src="/ui/core.js?v=2025-11-04"></script>
  <script src="/ui/profile.js?v=2026-08-06-allergen-safety"></script>
</body>
</html>
