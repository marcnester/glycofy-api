<!doctype html>
<html lang="en" class="ui-root">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Glycofy · Operations</title>
  <link rel="icon" href="/ui/assets/glycofy-mark.png" type="image/png" />
  <link rel="stylesheet" href="/ui/styles.css?v=2025-11-04" />
  <style>
    main{max-width:1120px;margin:auto;padding:32px 20px}.head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}
    h1{margin:0 0 6px}.muted{color:var(--muted)}select{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px}
    .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px}
    .label{color:var(--muted);font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}.value{font-size:1.9rem;font-weight:800;margin-top:8px}.wide{grid-column:span 2}
    .bar{height:8px;background:#222c39;border-radius:999px;overflow:hidden;margin-top:12px}.bar span{display:block;height:100%;background:var(--accent)}
    #state{margin-top:18px}@media(max-width:760px){.metrics{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}}@media(max-width:460px){.metrics{grid-template-columns:1fr}.wide{grid-column:span 1}.head{align-items:start;flex-direction:column}}
  </style>
</head>
<body>
  <main>
    <div class="head"><div><h1>AI operations</h1><div class="muted">Privacy-safe production health for Glycofy’s planning engine.</div></div><label class="muted">Window <select id="window"><option value="24">24 hours</option><option value="168" selected>7 days</option><option value="720">30 days</option></select></label></div>
    <section class="metrics" aria-live="polite">
      <article class="card"><div class="label">Requests</div><div class="value" id="requests">—</div></article>
      <article class="card"><div class="label">Failure rate</div><div class="value" id="failures">—</div><div class="bar"><span id="failureBar"></span></div></article>
      <article class="card"><div class="label">p95 latency</div><div class="value" id="latency">—</div></article>
      <article class="card"><div class="label">Estimated cost</div><div class="value" id="cost">—</div></article>
      <article class="card wide"><div class="label">Tokens</div><div class="value" id="tokens">—</div><div class="muted" id="tokenDetail"></div></article>
      <article class="card wide"><div class="label">Weekly jobs</div><div class="value" id="jobs">—</div><div class="muted" id="jobDetail"></div></article>
    </section>
    <p id="state" class="muted">Loading operational data…</p>
  </main>
  <script src="/ui/operations.js" defer></script>
</body>
</html>
