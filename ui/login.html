<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sign in · Glycofy</title>
  <link rel="icon" href="/ui/assets/glycofy-mark.png" type="image/png"/>
  <style>
    :root {
      --bg: #0d1117; --panel: #111826; --border: #1b2433;
      --accent: #50c88a; --accent-glow: #74dda9;
      --text: #e8eef5; --muted: #9db3cf;
      --radius: 16px; --shadow: 0 12px 30px rgba(0,0,0,0.4);
      --transition: 150ms ease;
    }
    * { box-sizing:border-box }
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
    a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
    header{padding:20px 40px;display:flex;justify-content:space-between;align-items:center}
    nav a{margin-right:18px;color:var(--muted);font-weight:500}
    main{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100% - 80px);padding:40px}
    h1{font-size:2rem;font-weight:700;margin:0 0 8px}
    p.sub{color:var(--muted);margin-bottom:24px}
    .msg{display:none;width:100%;max-width:400px;margin-bottom:14px;padding:10px 12px;border-radius:10px;font-size:14px}
    .msg.notice{display:block;background:#0e1a2b;border:1px solid #113055;color:#b7d9ff}
    .msg.error{display:block;background:#2b0e0e;border:1px solid #552222;color:#ffdede}
    .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
    label{font-weight:600;font-size:14px;margin-bottom:4px;display:block;color:var(--muted)}
    input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:#0c121e;color:var(--text);font-size:15px;transition:border var(--transition),background var(--transition)}
    input:focus{border-color:var(--accent);background:#0f1828;outline:none}
    .btn{background:var(--accent);border:none;border-radius:10px;padding:12px 16px;color:#071b14;font-weight:700;font-size:15px;cursor:pointer;transition:background var(--transition),transform var(--transition)}
    .btn:hover{background:var(--accent-glow);transform:translateY(-1px)}
    .row{display:flex;gap:10px;align-items:center;justify-content:space-between}
    .tip{font-size:13px;color:var(--muted)}
    .fineprint{font-size:12px;color:var(--muted);text-align:center;margin-top:-6px}
    .login-logo{display:block;width:min(100%,340px);height:auto;margin:0 auto 8px;border-radius:12px}
    .muted{color:var(--muted);font-size:12px}
    .or{display:flex;align-items:center;gap:12px;justify-content:center;color:var(--muted)}
    .or::before,.or::after{content:"";height:1px;background:var(--border);flex:1}
    .btn-google{background:#223047;border:1px solid #2e4060;color:#e6f0ff}
    .btn-google:hover{background:#2a3a57}
  </style>
</head>
<body>
<header>
  <span aria-hidden="true"></span>
  <nav class="muted">API: <span id="endpointNote"></span></nav>
</header>

<main>
  <img class="login-logo" src="/ui/assets/glycofy-logo-lockup.png" alt="Glycofy"/>
  <h1>Sign in</h1>
  <p class="sub">Welcome back</p>

  <div id="msg" class="msg"></div>

  <form id="login-form" class="card" autocomplete="on">
    <div>
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" required autocomplete="username"/>
    </div>
    <div>
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="••••••••" required autocomplete="current-password"/>
    </div>

    <div class="row">
      <button id="submitBtn" type="submit" class="btn">Sign in</button>
      <a id="demo" href="#" class="tip">use demo credentials</a>
    </div>

    <div class="or">or</div>

    <button id="googleBtn" type="button" class="btn btn-google">Continue with Google</button>

    <p class="fineprint">
      By continuing, you agree to the Terms and acknowledge the Privacy Policy.
    </p>
  </form>
</main>

<!-- core.js is optional; login.js is self-contained -->
<script src="/ui/core.js?v=2025-11-05" defer></script>
<script src="/ui/login.js?v=2025-11-05" defer></script>
</body>
</html>
