<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Glycofy • Profile</title>
  <link rel="stylesheet" href="/ui/styles.css"/>
  <link rel="icon" href="/ui/assets/glycofy-mark.png" type="image/png"/>
</head>
<body>
  <!-- Top nav (consistent with other pages) -->
  <header class="site-header">
    <a class="brand" href="/ui/" aria-label="Glycofy home">
      <img class="brand-logo" src="/ui/assets/glycofy-logo-lockup.png" alt="Glycofy"/>
    </a>
    <nav class="nav">
      <a href="/ui/index.html">Home</a>
      <a href="/ui/plan.html">Plan</a>
      <a href="/ui/profile.html" class="active">Profile</a>
      <a href="/ui/activities.html">Activities</a>
      <span id="unitBadge" class="pill hidden">Units: —</span>
      <button id="logout_btn" class="btn subtle">Logout</button>
    </nav>
  </header>

  <main class="container">
    <section class="page-head">
      <h1>Profile</h1>
      <p class="muted">Manage your account, preferences, and connected apps.</p>
    </section>

    <!-- Account card -->
    <section class="card">
      <header class="card-head">
        <h2>Account</h2>
      </header>
      <div class="card-body">
        <div class="grid grid-2">
          <div>
            <div class="label muted">Email</div>
            <div id="acctEmail" class="value">—</div>
          </div>
          <div>
            <div class="label muted">User</div>
            <div id="acctId" class="value">—</div>
          </div>
        </div>
      </div>
    </section>

    <!-- Preferences form -->
    <section class="card">
      <header class="card-head">
        <h2>Preferences</h2>
        <div id="saveStatus" class="muted"></div>
      </header>
      <div class="card-body">
        <form id="prefsForm" class="form-grid">
          <div class="field">
            <label for="sex">Sex</label>
            <select id="sex">
              <option value="">—</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="field">
            <label for="dob">Date of birth</label>
            <input id="dob" type="date" />
          </div>

          <div class="field">
            <label for="height_cm">Height (cm)</label>
            <input id="height_cm" type="number" step="0.1" inputmode="decimal" placeholder="e.g., 180" />
          </div>

          <div class="field">
            <label for="weight_kg">Weight (kg)</label>
            <input id="weight_kg" type="number" step="0.1" inputmode="decimal" placeholder="e.g., 75" />
          </div>

          <div class="field">
            <label for="diet_pref">Diet preference</label>
            <select id="diet_pref">
              <option value="">—</option>
              <option value="omnivore">Omnivore</option>
              <option value="vegetarian">Vegetarian</option>
              <option value="vegan">Vegan</option>
              <option value="pescatarian">Pescatarian</option>
              <option value="keto">Keto</option>
              <option value="mediterranean">Mediterranean</option>
            </select>
          </div>

          <div class="field">
            <label for="goal">Goal</label>
            <select id="goal">
              <option value="">—</option>
              <option value="weight_loss">Weight loss</option>
              <option value="maintenance">Maintenance</option>
              <option value="muscle_gain">Muscle gain</option>
              <option value="endurance">Endurance</option>
            </select>
          </div>

          <div class="field">
            <label for="timezone">Time zone</label>
            <input id="timezone" type="text" placeholder="e.g., America/Los_Angeles" />
          </div>

          <div class="actions row">
            <button type="submit" class="btn primary">Save preferences</button>
          </div>
        </form>
      </div>
    </section>

    <!-- Connected apps -->
    <section class="card">
      <header class="card-head">
        <h2>Connected apps</h2>
      </header>
      <div class="card-body">
        <div id="appsStatus" class="muted">—</div>
        <div class="row gap">
          <button id="refetchStatusBtn" class="btn subtle">Refresh status</button>
          <button id="linkStravaBtn" class="btn">Link Strava</button>
          <button id="syncStravaBtn" class="btn subtle">Sync recent from Strava</button>
        </div>
      </div>
    </section>
  </main>

  <script src="/ui/app.js"></script>
  <script src="/ui/profile.js"></script>
</body>
</html>
