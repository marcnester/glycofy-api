services:
  - type: web
    name: glycofy-api
    runtime: docker
    plan: 1c-2g
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    preDeployCommand: alembic upgrade head
    healthCheckPath: /ready
    domains:
      - app.glycofy.ai
    # Prevent clients from bypassing Cloudflare security controls through the
    # service's default public hostname. Render health checks use a verified
    # custom domain as Host when one is configured.
    renderSubdomainPolicy: disabled
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: glycofy-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        value: https://app.glycofy.ai
      - key: ALLOWED_ORIGINS
        value: https://app.glycofy.ai
      - key: ALLOWED_HOSTS
        value: app.glycofy.ai
      - key: COOKIE_SECURE
        value: "true"
      - key: ENABLE_DEV_ROUTES
        value: "false"
      - key: JWT_ISS
        value: https://app.glycofy.ai
      - key: JWT_AUD
        value: glycofy.web
      - key: JWT_SECRET
        sync: false
      - key: OAUTH_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_REASONING_EFFORT
        value: none
      - key: OPENAI_PRICE_PER_1K_INPUT
        value: "0.0002"
      - key: OPENAI_PRICE_PER_1K_OUTPUT
        value: "0.0012"
      - key: USDA_FDC_API_KEY
        sync: false
      - key: USDA_FDC_REQUIRED
        value: "false"
      - key: USDA_FDC_TIMEOUT_SECONDS
        value: "10"
      - key: USDA_FDC_WEEKLY_SYNC_LOOKUPS
        value: "12"
      - key: NUTRITION_VALIDATION_INTERVAL_SECONDS
        value: "900"
      - key: NUTRITION_VALIDATION_BATCH_SIZE
        value: "20"
      - key: INSTACART_API_KEY
        sync: false
      - key: INSTACART_API_BASE
        value: https://connect.instacart.com
      - key: TRAININGPEAKS_CLIENT_ID
        sync: false
      - key: TRAININGPEAKS_CLIENT_SECRET
        sync: false
      - key: TRAININGPEAKS_REDIRECT_URI
        value: https://app.glycofy.ai/oauth/trainingpeaks/callback
      - key: SECURITY_ALERT_EMAIL_TO
        sync: false
      - key: SECURITY_ALERT_EMAIL_ENABLED
        value: "true"
      - key: SMTP_HOST
        value: smtp.mx.cloudflare.net
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USERNAME
        value: api_token
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: noreply@glycofy.ai
      - key: SMTP_USE_TLS
        value: "false"
      - key: WEEKLY_JOB_RETENTION_DAYS
        value: "30"
      - key: AI_METRIC_RETENTION_DAYS
        value: "90"
      - key: WEEKLY_JOB_MAX_ATTEMPTS
        value: "3"
      - key: WEEKLY_JOB_MAX_WORKERS
        value: "1"
      - key: WEEKLY_DAY_MAX_WORKERS
        value: "3"
      - key: WEEKLY_REPAIR_MAX_SLOTS
        value: "10"
      - key: LLM_CACHE_MAX_ENTRIES
        value: "64"
      - key: WEB_PROCESS_COUNT
        value: "1"
      - key: ADMIN_EMAILS
        sync: false
      - key: BETA_FEEDBACK_ENABLED
        value: "true"
      - key: BETA_FEEDBACK_EMAIL_ENABLED
        value: "true"
      - key: BETA_FEEDBACK_EMAIL_COOLDOWN_SECONDS
        value: "300"
      - key: BETA_ANALYTICS_ENABLED
        value: "true"
      - key: FEATURE_FLAGS
        value: beta_feedback,beta_analytics
      - key: PRODUCT_EVENT_RETENTION_DAYS
        value: "180"
      - key: BETA_FEEDBACK_RETENTION_DAYS
        value: "365"

databases:
  - name: glycofy-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "18"
    databaseName: glycofy
    user: glycofy
    ipAllowList: []
